  <section class="c-hero c-prose">
    <p class="c-eyebrow">404</p>
    <h1>找不到这一页</h1>
    <p class="c-lead">这个地址没有对应的页面。</p>
    <p>可能的原因：</p>
    <ul>
      <li>链接少复制了一截，或者多了个字符；</li>
      <li>这一页已经删除或搬走了；</li>
      <li>行程到期被自动删除了（出行日期过后 60 天、连续 180 天没人编辑，取较晚的那天）。</li>
    </ul>
    <p>可以从这几个地方重新开始：</p>
    <div class="c-row" style="margin-top: var(--sp-4)">
      <a class="c-btn c-btn--primary" href="/">{{icon:map}}回首页</a>
      <a class="c-btn" href="/guide">使用指南</a>
      <a class="c-btn" href="/demo">示例方案页</a>
    </div>
  </section>
</div>
