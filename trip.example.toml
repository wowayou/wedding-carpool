# 婚礼拼车配置示例：复制成 trip.toml 再改成你们的真实信息
#   cp trip.example.toml trip.toml
# 地址写得越具体越准（到区县、小区或酒店名）；解析不准时可直接写 location = "经度,纬度"（高德坐标）

[venue]
name = "婚礼场地"
address = "安徽省黄山市黟县宏村镇"   # 换成婚礼酒店的完整地址

[options]
max_detour_min = 30       # 车主默认最多愿意为接人多绕几分钟
max_stops = 2             # 每辆车最多停几次接人
travel_date = "2026-10-17"  # 出发日期，用来估算不开车的人坐公共交通（含火车）到各站要多久
travel_time = "08:00"       # 出发时间
# estimate_rail = false     # 不想估算公共交通时关掉（少调用接口）
station_cost_min = 60     # 既没填 rail_min、也没估算出公共交通方案时，把「坐车去站」估成多少分钟
discover_radius_km = 120  # 没写候选站时，自动搜索场地周围多大范围内的火车站
discover_limit = 10       # 自动搜索最多保留几个站
# outbound = false          # 不规划去程，只规划返程（这时必须开返程，并填 [return] 的 date）
# 没搭上车的人另外打车：
# taxi_mode = "save"        # "save" 默认，尽量拼车省钱；"fast" 各人走自己最快的站
# taxi_pool_extra_min = 30  # 为了拼车，一个人最多比他自己最快的走法多花几分钟
# taxi_wait_min = 30        # 同一辆出租里的人，到站（返程是离场）的时间最多相差几分钟

# 推荐车站的找站设置（可选，都有默认值，不写就按默认；也可以在编辑页的「推荐车站」抽屉里改）。
# 这一段要写在 [options] 的其他键之后、[return] 之前。
# [options.suggest]
# areas = ["dest", "owner_home", "owner_route"]  # 在哪些地方找：dest 目的地周边，owner_home 车主出发地附近，owner_route 车主路上，rider_home 乘客出发地附近（默认不找）
# route_cover = "along"      # 车主路上怎么圈范围："along" 沿路线取点（省搜索次数）；"detour" 绕路上限内全覆盖（更全，搜索更多）
# dest_radius_km = 90        # 目的地周边多大范围，30–150 公里
# home_radius_km = 30        # 出发地附近多大范围，10–50 公里
# route_step_km = 30         # 车主路上每隔多远找一次，10–60 公里
# route_radius_km = 25       # 车主路上每次找多大范围，5–60 公里；要大于间隔的一半，两圈之间才连得上
# drivers = ["老王"]         # 用哪几位车主的路线；不写就是全部车主
# route_strategy = 0         # 车主路线怎么走：0 高德默认（速度优先），12 躲避拥堵，13 不走高速，14 避免收费，19 高速优先
# alt_routes = false         # 也沿备选路线找：开了以后高德给的最多 3 条路线都取点，能照顾到平行的高速
# max_searches = 80          # 每次最多搜索几次，20–200；到上限就停，结果里写明可能没列全
# sort = "detour"            # 怎么排序："detour" 车主最少绕路；"dest" 到目的地最近；"rider_home" 离乘客家最近（要找乘客出发地附近）
# over_limit = "show"        # 超过车主绕路上限的站："show" 照常列出、标明、不默认勾选；"hide" 直接不显示
# show_count = 15            # 最多显示几个站，5–30
# checked_count = 6          # 默认勾选几个，0–30，不能超过显示个数
# filter_12306 = true        # 用 12306 站名表过滤；关掉会混进货运站

# 返程（可选）：散场后车主从场地出发，顺路送人去车站或回家
# [return]
# enabled = true
# depart_time = "20:30"   # 车主几点从场地出发
# security_min = 40       # 高铁发车前多久到站
# max_wait_min = 30       # 乘客准备好后，最多愿意等车主多久（车主比乘客早走就带不了）
# date = "2026-10-18"     # 返程日期，用来拼 12306 查询链接；不写就用 travel_date。只规划返程（outbound = false）时必填

# 候选高铁站：不写就自动搜索；第一次跑完看报告里的「候选站对比」，再把合适的站写进来
# [[stations]]
# name = "黄山北站"
# [[stations]]
# name = "黟县东站"

# 每位舍友一段 [[people]]
# car_seats：开车就写空座数（不算司机和已经坐满的家人）；不开车就不写这一行

[[people]]
name = "老王"
from = "浙江省杭州市西湖区"
car_seats = 3

[[people]]
name = "老张"
from = "江苏省南京市鼓楼区"
car_seats = 2
max_detour_min = 20       # 单独覆盖默认绕路上限
# return_drives = false     # 返程不顺路送人（默认送）
# return_max_detour_min = 15  # 返程最多绕多久，不写就和去程一样
# leave_time = "21:30"        # 开了返程时：这个人几点离开场地，不写就是 [return] 的 depart_time；车主的离场时间就是车的出发时间

[[people]]
name = "我"
from = "上海市浦东新区"
# party = 2               # 同行人数（含自己）：这组人一起上同一辆车，或者一起打车
# pickup_at_home = false  # 默认允许车主到家附近接；住得远、不可能顺路时可以关掉，少查几次

[[people]]
name = "小陈"
from = "湖北省武汉市洪山区"
# 可选，推荐填 trains：
# trains = { "黄山北站" = "G1234 武汉08:00→黄山北12:10" }  # 12306 查的车次和时刻：自动算用时，并倒推车主几点出发
# rail_min = { "黟县东站" = 270 }                         # 只知道大概要多久时填分钟数（含去车站和候车）
# stations = ["黄山北站"]                                  # 只考虑这些站
# 填了 trains 或 rail_min，就只考虑填了的站
# return_trains = { "黄山北站" = "G1235 黄山北21:40→武汉01:30" }  # 开了返程时：回程车次，按发车前 security_min 分钟到站倒推
